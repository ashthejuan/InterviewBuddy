services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interviewbuddy
      POSTGRES_USER: interviewbuddy
      POSTGRES_PASSWORD: interviewbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewbuddy -d interviewbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Local media server for the voice path (dev keys: devkey / secret). Opt in:
  #   docker compose --profile voice up -d livekit
  livekit:
    image: livekit/livekit-server:latest
    profiles: ["voice"]
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres_data:
  minio_data:
